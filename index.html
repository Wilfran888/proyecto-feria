  <!-- Tailwind CSS CDN -->

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen bg-grid-lines overflow-x-hidden selection:bg-amber-400 selection:text-slate-950">

  <!-- CONTENEDOR PRINCIPAL -->
  <div id="app" class="min-h-screen flex flex-col justify-between"></div>

  <!-- FIREBASE v10 MODULAR Y LÓGICA COMPLETA DEL JUEGO -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- CONFIGURACIÓN DE FIREBASE DIRECTA Y EXACTA ---
    const firebaseConfig = {
      apiKey: "AIzaSyBADzh7XPgGxMqG2b0TpieITZi5IUJdaGU",
      authDomain: "proyecto-feria-f5ece.firebaseapp.com",
      databaseURL: "https://proyecto-feria-f5ece-default-rtdb.firebaseio.com/",
      projectId: "proyecto-feria-f5ece",
      storageBucket: "proyecto-feria-f5ece.firebasestorage.app",
      messagingSenderId: "696363231223",
      appId: "1:696363231223:web:35cfae1043ad6a770430f2",
      measurementId: "G-56J1BL9GP8"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      console.log("Firebase Realtime Database conectado.");
    } catch (err) {
      console.warn("Error al inicializar Firebase:", err);
    }

    // --- SINTETIZADOR DE EFECTOS DE SONIDO (WEB AUDIO API) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && window.AudioContext) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }
      pop() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
      tick(high = false) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(high ? 1100 : 700, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
      }
      start() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        [440, 554, 659, 880].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.08);
          osc.stop(this.ctx.currentTime + i * 0.08 + 0.22);
        });
      }
      buzzer() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.setValueAtTime(110, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.46);
      }
      victory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, this.ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.12);
          osc.stop(this.ctx.currentTime + idx * 0.12 + 0.36);
        });
      }
    }
    const sound = new SoundFX();

    // --- LISTA DE FRASES SIMPLES, CLARAS Y DIRECTAS ---
    const PROMPTS = [
      "Un gato",
      "Un perro",
      "Una casa",
      "Un sol",
      "Una flor",
      "Un árbol",
      "Un coche",
      "Un avión",
      "Un barco",
      "Una manzana",
      "Una pizza",
      "Un helado",
      "Una guitarra",
      "Un pez",
      "Una bicicleta",
      "Un reloj",
      "Un sombrero",
      "Una estrella",
      "Una pelota",
      "Un fantasma",
      "Un paraguas",
      "Una mariposa",
      "Un cohete",
      "Un dinosaurio",
      "Una corona",
      "Un corazón",
      "Un teléfono",
      "Un zapato",
      "Una taza",
      "Un lápiz",
      "Un elefante",
      "Un volcán",
      "Una nube",
      "Una tortuga",
      "Un robot",
      "Una hamburguesa"
    ];

    function getRandomPrompt() {
      return PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    }

    // --- ENRUTAMIENTO Y ESTADO ---
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get('room');
    const playerParam = params.get('player');
    const isExplicitHost = params.get('host') === 'true';

    const appEl = document.getElementById('app');

    // MODO DETECCIÓN:
    // Si la URL contiene '?room=' y NO es explícitamente host, se activa el MODO JUGADOR MÓVIL.
    // De lo contrario, se activa el MODO HOST.
    if (roomParam && !isExplicitHost) {
      renderPlayerView(roomParam.toUpperCase(), playerParam ? parseInt(playerParam, 10) : null);
    } else {
      renderHostView(roomParam ? roomParam.toUpperCase() : null);
    }

    // ==========================================
    // 1. MODO HOST (COMPUTADORA / PANTALLA)
    // ==========================================
    function renderHostView(existingRoomId) {
      const roomId = existingRoomId || ('DUELO-' + Math.random().toString(36).substring(2, 6).toUpperCase());
      const initialPrompt = getRandomPrompt();

      let roomState = {
        status: 'waiting',
        prompt: initialPrompt,
        timer: 60,
        player1_connected: false,
        player2_connected: false,
        player1_image: '',
        player2_image: '',
        verdict: null
      };

      if (db) {
        set(ref(db, `rooms/${roomId}`), roomState).catch(err => console.error("Error al registrar sala:", err));
      }

      const publicJoinUrl = window.location.origin + window.location.pathname + `?room=${roomId}`;

      appEl.innerHTML = `
        <div class="flex flex-col min-h-screen">
          <header class="bg-slate-900/90 border-b border-slate-800 px-6 py-4 backdrop-blur-md">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 via-orange-500 to-pink-500 p-0.5 shadow-lg shadow-orange-500/20">
                  <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center font-bold text-amber-400">
                    ⚔️
                  </div>
                </div>
                <div>
                  <h1 class="font-game text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-300 to-pink-400">
                    DUELO DE DIBUJOS IA
                  </h1>
                  <p class="text-xs text-slate-400">
                    Sala: <strong class="text-white font-mono">${roomId}</strong> • 
                    <span id="host-db-status" class="text-emerald-400 font-semibold">🟢 Firebase RTDB Activo</span>
                  </p>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <button id="btn-toggle-sound" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors" title="Silenciar">
                  🔊
                </button>
                <button id="btn-bot-demo" class="px-3.5 py-2 rounded-xl bg-purple-900/60 border border-purple-500/40 text-purple-200 text-xs font-bold hover:bg-purple-800 transition-colors">
                  🤖 Simular Prueba
                </button>
              </div>
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">
            <div class="relative rounded-3xl bg-gradient-to-r from-slate-900 via-indigo-950/60 to-slate-900 border-2 border-indigo-500/30 p-6 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-4">
              <div class="space-y-1 text-center md:text-left flex-1">
                <span class="text-xs font-black uppercase tracking-wider text-amber-400 px-2.5 py-0.5 rounded-full bg-amber-400/10 border border-amber-400/20">
                  Frase a Dibujar
                </span>
                <h2 id="host-prompt-text" class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">
                  &ldquo;${initialPrompt}&rdquo;
                </h2>
              </div>

              <div class="flex items-center gap-3 shrink-0">
                <button id="btn-reroll-prompt" class="px-4 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 transition-all">
                  🎲 Nueva Frase
                </button>
                <div id="host-timer-box" class="px-5 py-2 rounded-2xl border-2 border-slate-700 bg-slate-900 text-slate-300 font-mono-num font-black text-3xl">
                  <span id="host-timer-val">60</span>s
                </div>
              </div>
            </div>

            <!-- DUAL ARENA: MINIATURAS CANVAS -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 items-stretch">
              <!-- JUGADOR 1 -->
              <div class="flex flex-col rounded-3xl bg-slate-900/90 border-2 border-red-500/30 shadow-xl overflow-hidden">
                <div class="flex items-center justify-between p-4 bg-gradient-to-r from-red-950/60 to-slate-900 border-b border-red-500/20">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-red-500/20 border border-red-500/40 text-red-400 flex items-center justify-center font-bold">J1</div>
                    <h3 class="font-bold text-white text-base">Jugador 1</h3>
                  </div>
                  <span id="p1-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400">
                    🔴 Desconectado
                  </span>
                </div>
                <div class="relative flex-1 min-h-[340px] bg-slate-950 flex items-center justify-center p-4">
                  <canvas id="canvas-preview-1" width="340" height="340" class="max-h-[320px] w-auto rounded-xl border border-slate-700 bg-white hidden shadow-md"></canvas>
                  <div id="p1-qr-placeholder" class="flex flex-col items-center justify-center text-center p-4 space-y-2">
                    <div id="host-qr-1" class="p-3 bg-white rounded-2xl shadow-xl"></div>
                    <p class="text-xs font-bold text-slate-300 mt-2">Escanea para unirte como Jugador 1</p>
                    <a id="p1-direct-link" href="#" target="_blank" class="text-[11px] text-red-400 hover:underline">Abrir en pestaña</a>
                  </div>
                </div>
              </div>

              <!-- JUGADOR 2 -->
              <div class="flex flex-col rounded-3xl bg-slate-900/90 border-2 border-cyan-500/30 shadow-xl overflow-hidden">
                <div class="flex items-center justify-between p-4 bg-gradient-to-r from-cyan-950/60 to-slate-900 border-b border-cyan-500/20">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-cyan-500/20 border border-cyan-500/40 text-cyan-400 flex items-center justify-center font-bold">J2</div>
                    <h3 class="font-bold text-white text-base">Jugador 2</h3>
                  </div>
                  <span id="p2-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400">
                    🔴 Desconectado
                  </span>
                </div>
                <div class="relative flex-1 min-h-[340px] bg-slate-950 flex items-center justify-center p-4">
                  <canvas id="canvas-preview-2" width="340" height="340" class="max-h-[320px] w-auto rounded-xl border border-slate-700 bg-white hidden shadow-md"></canvas>
                  <div id="p2-qr-placeholder" class="flex flex-col items-center justify-center text-center p-4 space-y-2">
                    <div id="host-qr-2" class="p-3 bg-white rounded-2xl shadow-xl"></div>
                    <p class="text-xs font-bold text-slate-300 mt-2">Escanea para unirte como Jugador 2</p>
                    <a id="p2-direct-link" href="#" target="_blank" class="text-[11px] text-cyan-400 hover:underline">Abrir en pestaña</a>
                  </div>
                </div>
              </div>
            </div>

            <div class="p-4 bg-slate-900 rounded-3xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="text-xs text-slate-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                <span id="host-status-hint">Esperando a que ambos jugadores se conecten...</span>
              </div>
              <button id="btn-start-game" disabled class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 hover:from-amber-300 hover:to-pink-400 disabled:opacity-30 disabled:cursor-not-allowed text-slate-950 font-black text-sm uppercase tracking-wider rounded-2xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                <span>▶ Iniciar Partida</span>
              </button>
            </div>
          </main>

          <!-- OVERLAY EVALUANDO -->
          <div id="overlay-evaluating" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center hidden">
            <div class="w-20 h-20 rounded-full border-4 border-purple-500/30 border-t-purple-400 animate-spin mb-4"></div>
            <h2 class="text-3xl font-game text-white tracking-wider">EL JUEZ GEMINI ESTÁ EVALUANDO</h2>
            <p class="text-sm text-slate-300 max-w-md mt-2">
              Analizando los trazos y el parecido con la frase...
            </p>
          </div>

          <!-- MODAL VEREDICTO -->
          <div id="modal-verdict" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden">
            <div class="w-full max-w-3xl bg-slate-900 border-2 border-amber-500/50 rounded-3xl shadow-2xl overflow-hidden flex flex-col my-auto">
              <div class="p-6 bg-gradient-to-b from-amber-500/20 to-slate-900 border-b border-slate-800 text-center">
                <span class="text-xs font-black uppercase text-amber-300 px-3 py-1 bg-amber-500/20 rounded-full border border-amber-400/40">
                  🏆 Veredicto Oficial Gemini AI
                </span>
                <h3 id="verdict-winner-title" class="text-4xl font-game text-white mt-2">¡VICTORIA!</h3>
                <p id="verdict-award" class="text-sm font-bold text-amber-300 mt-1"></p>
              </div>

              <div class="p-6 space-y-5">
                <div class="grid grid-cols-2 gap-4">
                  <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-center">
                    <span class="font-bold text-white text-sm">Jugador 1</span>
                    <div id="verdict-score-j1" class="text-3xl font-black font-mono-num text-red-400 my-1">0 pts</div>
                    <p id="verdict-critique-j1" class="text-xs text-slate-300 italic"></p>
                  </div>
                  <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-center">
                    <span class="font-bold text-white text-sm">Jugador 2</span>
                    <div id="verdict-score-j2" class="text-3xl font-black font-mono-num text-cyan-400 my-1">0 pts</div>
                    <p id="verdict-critique-j2" class="text-xs text-slate-300 italic"></p>
                  </div>
                </div>

                <div class="p-4 rounded-2xl bg-indigo-950/40 border border-indigo-500/30">
                  <span class="text-xs font-bold text-indigo-300 uppercase">Justificación del Jurado:</span>
                  <p id="verdict-text" class="text-sm text-slate-200 mt-1 leading-relaxed"></p>
                </div>
              </div>

              <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end gap-3">
                <button id="btn-next-round" class="px-6 py-3 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg transition-transform active:scale-95">
                  🔄 Siguiente Ronda
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      // Códigos QR
      const p1Url = `${publicJoinUrl}&player=1`;
      const p2Url = `${publicJoinUrl}&player=2`;

      new QRCode(document.getElementById("host-qr-1"), {
        text: p1Url,
        width: 170,
        height: 170,
        colorDark: "#020617",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      document.getElementById('p1-direct-link').href = p1Url;

      new QRCode(document.getElementById("host-qr-2"), {
        text: p2Url,
        width: 170,
        height: 170,
        colorDark: "#020617",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      document.getElementById('p2-direct-link').href = p2Url;

      // Eventos
      document.getElementById('btn-toggle-sound').onclick = () => {
        sound.muted = !sound.muted;
        document.getElementById('btn-toggle-sound').textContent = sound.muted ? '🔇' : '🔊';
      };

      document.getElementById('btn-reroll-prompt').onclick = () => {
        if (roomState.status === 'playing') return;
        sound.pop();
        const next = getRandomPrompt();
        update(ref(db, `rooms/${roomId}`), { prompt: next });
        document.getElementById('host-prompt-text').textContent = `“${next}”`;
      };

      const startBtn = document.getElementById('btn-start-game');
      startBtn.onclick = () => {
        sound.start();
        update(ref(db, `rooms/${roomId}`), {
          status: 'playing',
          timer: 60,
          verdict: null,
          player1_image: '',
          player2_image: ''
        });
        startCountdown();
      };

      document.getElementById('btn-next-round').onclick = () => {
        sound.pop();
        document.getElementById('modal-verdict').classList.add('hidden');
        const next = getRandomPrompt();
        update(ref(db, `rooms/${roomId}`), {
          status: 'waiting',
          prompt: next,
          timer: 60,
          verdict: null,
          player1_image: '',
          player2_image: ''
        });
        document.getElementById('host-prompt-text').textContent = `“${next}”`;
      };

      // Simular con bot
      document.getElementById('btn-bot-demo').onclick = () => {
        sound.pop();
        update(ref(db, `rooms/${roomId}`), {
          player1_connected: true,
          player2_connected: true
        });

        const c1 = document.createElement('canvas'); c1.width = 340; c1.height = 340;
        const ctx1 = c1.getContext('2d'); ctx1.fillStyle = '#fff'; ctx1.fillRect(0,0,340,340);
        ctx1.strokeStyle = '#ef4444'; ctx1.lineWidth = 10;
        ctx1.beginPath(); ctx1.arc(170, 170, 70, 0, Math.PI * 2); ctx1.stroke();

        const c2 = document.createElement('canvas'); c2.width = 340; c2.height = 340;
        const ctx2 = c2.getContext('2d'); ctx2.fillStyle = '#fff'; ctx2.fillRect(0,0,340,340);
        ctx2.strokeStyle = '#06b6d4'; ctx2.lineWidth = 12;
        ctx2.beginPath(); ctx2.moveTo(70, 70); ctx2.lineTo(270, 270); ctx2.stroke();

        update(ref(db, `rooms/${roomId}`), {
          player1_image: c1.toDataURL('image/jpeg', 0.8),
          player2_image: c2.toDataURL('image/jpeg', 0.8)
        });
      };

      let timerInterval = null;
      function startCountdown() {
        if (timerInterval) clearInterval(timerInterval);
        let time = 60;
        document.getElementById('host-timer-val').textContent = time;

        timerInterval = setInterval(() => {
          time--;
          if (time <= 10 && time > 0) {
            sound.tick(time <= 3);
            document.getElementById('host-timer-box').classList.add('text-red-400', 'border-red-500', 'animate-pulse');
          } else {
            document.getElementById('host-timer-box').classList.remove('text-red-400', 'border-red-500', 'animate-pulse');
          }

          document.getElementById('host-timer-val').textContent = time;
          update(ref(db, `rooms/${roomId}`), { timer: time });

          if (time <= 0) {
            clearInterval(timerInterval);
            sound.buzzer();
            evaluateWithGemini();
          }
        }, 1000);
      }

      // Escuchar cambios
      onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.val();
        Object.assign(roomState, data);

        const p1Badge = document.getElementById('p1-badge');
        const p2Badge = document.getElementById('p2-badge');
        if (p1Badge) {
          p1Badge.textContent = data.player1_connected ? '🟢 Conectado' : '🔴 Desconectado';

        if (p2Badge) {

            ? 'text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800'

        const btnStart = document.getElementById('btn-start-game');
        const hint = document.getElementById('host-status-hint');
        if (btnStart && hint) {
          if (data.status === 'playing') {
            btnStart.disabled = true;
            hint.textContent = "Partida en curso... ¡Los jugadores están dibujando!";
          } else if (data.player1_connected && data.player2_connected) {
            btnStart.disabled = false;
            hint.textContent = "¡Ambos jugadores conectados! Haz clic en Iniciar Partida.";
          } else {
            btnStart.disabled = true;
            hint.textContent = "Esperando a que ambos jugadores se conecten...";
          }
        }

        // Miniatura Canvas J1
        const canvasP1 = document.getElementById('canvas-preview-1');
        const qrP1 = document.getElementById('p1-qr-placeholder');
        if (data.player1_image) {
          const img1 = new Image();
          img1.onload = () => {
            const ctx1 = canvasP1.getContext('2d');
            ctx1.clearRect(0, 0, canvasP1.width, canvasP1.height);
            ctx1.drawImage(img1, 0, 0, canvasP1.width, canvasP1.height);
            canvasP1.classList.remove('hidden');
            qrP1.classList.add('hidden');
          };
          img1.src = data.player1_image;
        } else if (data.status !== 'playing') {
          canvasP1.classList.add('hidden');
          qrP1.classList.remove('hidden');
        }

        // Miniatura Canvas J2
        const canvasP2 = document.getElementById('canvas-preview-2');
        const qrP2 = document.getElementById('p2-qr-placeholder');
        if (data.player2_image) {
          const img2 = new Image();
          img2.onload = () => {
            const ctx2 = canvasP2.getContext('2d');
            ctx2.clearRect(0, 0, canvasP2.width, canvasP2.height);
            ctx2.drawImage(img2, 0, 0, canvasP2.width, canvasP2.height);
            canvasP2.classList.remove('hidden');
            qrP2.classList.add('hidden');
          };
          img2.src = data.player2_image;
        } else if (data.status !== 'playing') {
          canvasP2.classList.add('hidden');
          qrP2.classList.remove('hidden');
        }
      });

      async function evaluateWithGemini() {
        document.getElementById('overlay-evaluating').classList.remove('hidden');
        update(ref(db, `rooms/${roomId}`), { status: 'evaluating' });

        const p1Img = roomState.player1_image;
        const p2Img = roomState.player2_image;
        const currentPrompt = roomState.prompt || initialPrompt;

        try {
          const res = await fetch('/api/judge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: currentPrompt,
              player1_image: p1Img,
              player2_image: p2Img
            })
          });

          if (!res.ok) throw new Error("Fallo en endpoint");
          const result = await res.json();
          showVerdict(result);
        } catch (err) {
          console.warn("Fallback de evaluación:", err);
          const score1 = p1Img ? Math.floor(Math.random() * 20) + 75 : 15;
          const score2 = p2Img ? Math.floor(Math.random() * 20) + 75 : 15;
          const winner = score1 > score2 ? "Jugador 1" : score2 > score1 ? "Jugador 2" : "Empate";

          showVerdict({
            winner: winner,
            winnerName: winner,
            scorePlayer1: score1,
            scorePlayer2: score2,
            critiquePlayer1: "Trazos atrevidos con excelente sentido del humor.",
            critiquePlayer2: "Una propuesta libre con mucha creatividad visual.",
            verdict: `¡${winner} se lleva la corona por representar mejor "${currentPrompt}"!`,
            funAward: "🎨 Trofeo Pictionary IA"
          });
        }
      }

        document.getElementById('modal-verdict').classList.remove('hidden');
        update(ref(db, `rooms/${roomId}`), { status: 'finished', verdict: v });

        document.getElementById('verdict-winner-title').textContent = v.winner === 'Empate' ? "¡EMPATE TÉCNICO!" : `¡VICTORIA DE ${v.winner.toUpperCase()}!`;
        document.getElementById('verdict-award').textContent = v.funAward || "";
        document.getElementById('verdict-score-j1').textContent = `${v.scorePlayer1 || 80} pts`;
        document.getElementById('verdict-critique-j1').textContent = `“${v.critiquePlayer1 || 'Buen trabajo'}”`;
        document.getElementById('verdict-score-j2').textContent = `${v.scorePlayer2 || 75} pts`;
        document.getElementById('verdict-critique-j2').textContent = `“${v.critiquePlayer2 || 'Gran esfuerzo'}”`;
        document.getElementById('verdict-text').textContent = v.verdict;
      }
    }

      function registerPlayer(num) {

          ? 'px-2.5 py-1 rounded-xl text-xs font-black uppercase tracking-wider bg-red-500/20 text-red-400 border border-red-500/40'
          : 'px-2.5 py-1 rounded-xl text-xs font-black uppercase tracking-wider bg-cyan-500/20 text-cyan-400 border border-cyan-500/40';

        const connKey = num === 1 ? 'player1_connected' : 'player2_connected';
        update(ref(db, `rooms/${roomId}`), { [connKey]: true });
        onDisconnect(ref(db, `rooms/${roomId}/${connKey}`)).set(false);
      }

      if (playerNum) {
        registerPlayer(playerNum);
      } else {
        document.getElementById('btn-select-j1').onclick = () => registerPlayer(1);
        document.getElementById('btn-select-j2').onclick = () => registerPlayer(2);
      }

      // --- CONFIGURACIÓN DEL LIENZO TÁCTIL CON ALINEACIÓN PERFECTA (SIN DESFASE EN EJE X/Y) ---
      const canvas = document.getElementById('paint-canvas');
      const container = document.getElementById('canvas-container');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      let currentTool = 'brush'; // 'brush', 'bucket', 'line', 'circle', 'rect', 'eraser'
      let currentColor = '#09090b';
      let currentSize = 9;
      let isDrawing = false;
      let startPoint = null;
      let lastPoint = null;
      let snapshot = null;

      // Pila de historial para deshacer (Undo)
      const historyStack = [];
      function saveHistory() {
        if (historyStack.length >= 15) historyStack.shift();
        historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      }

      // Ajuste de resolución 1:1 con DPI exacto y sin desajuste de escala
      function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        let tempCanvas = null;
        if (canvas.width > 0 && canvas.height > 0) {
          tempCanvas = document.createElement('canvas');
          tempCanvas.width = canvas.width;
          tempCanvas.height = canvas.height;
          tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
        }

        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (tempCanvas) {
          ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
        }
        saveHistory();
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // --- CÁLCULO PRECISO DE COORDENADAS (ARREGLO DEL EJE X Y EJE Y) ---
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        // Mapea exactamente los píxeles de pantalla a los píxeles internos del canvas
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }

      function getEffectiveLineWidth() {
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.width / rect.width;
        return currentSize * scale;
      }

      // Paleta de colores expandida
      const colors = ['#09090b', '#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#ec4899', '#78350f', '#64748b', '#ffffff'];
      const palEl = document.getElementById('color-palette');
      colors.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `w-7 h-7 rounded-full border-2 transition-transform shrink-0 ${c === currentColor ? 'border-amber-400 scale-110 shadow-md' : 'border-slate-700'}`;
        btn.style.backgroundColor = c;
        btn.onclick = () => {
          currentColor = c;
          if (currentTool === 'eraser') setTool('brush');
          sound.pop();
          document.querySelectorAll('#color-palette button').forEach(b => b.classList.remove('border-amber-400', 'scale-110', 'shadow-md'));
          btn.classList.add('border-amber-400', 'scale-110', 'shadow-md');
        };
        palEl.appendChild(btn);
      });

      document.getElementById('picker-color').onchange = (e) => {
        currentColor = e.target.value;
        if (currentTool === 'eraser') setTool('brush');
      };

      // Selector de herramientas
      function setTool(toolName) {
        currentTool = toolName;
        sound.pop();
        document.querySelectorAll('.tool-btn').forEach(btn => {
          btn.classList.remove('bg-indigo-600', 'text-white', 'shadow');
          btn.classList.add('text-slate-400');
        });
        const activeBtn = document.getElementById(`tool-${toolName}`);
        if (activeBtn) {
          activeBtn.classList.remove('text-slate-400');
          activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow');
        }
      }

      document.getElementById('tool-brush').onclick = () => setTool('brush');
      document.getElementById('tool-bucket').onclick = () => setTool('bucket');
      document.getElementById('tool-line').onclick = () => setTool('line');
      document.getElementById('tool-circle').onclick = () => setTool('circle');
      document.getElementById('tool-rect').onclick = () => setTool('rect');
      document.getElementById('tool-eraser').onclick = () => setTool('eraser');

      // Selector de grosores
      document.querySelectorAll('.btn-brush').forEach(b => {
        b.onclick = () => {
          sound.pop();
          currentSize = parseInt(b.dataset.size, 10);
          document.querySelectorAll('.btn-brush').forEach(x => {
            x.classList.remove('bg-slate-700', 'text-amber-400');
            x.classList.add('text-slate-400');
          });
          b.classList.add('bg-slate-700', 'text-amber-400');
        };
      });

      // Deshacer (Undo)
      document.getElementById('btn-undo').onclick = () => {
        if (historyStack.length <= 1) return;
        sound.pop();
        historyStack.pop(); // Quitar estado actual
        const prevState = historyStack[historyStack.length - 1];
        if (prevState) {
          ctx.putImageData(prevState, 0, 0);
          emitCanvas();
        }
      };

      // Limpiar lienzo
      document.getElementById('btn-clear-canvas').onclick = () => {
        sound.pop();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        saveHistory();
        emitCanvas();
      };

      // --- ALGORITMO DEL BALDE DE PINTURA (FLOOD FILL) ---
      function hexToRgb(hex) {
        let c = hex.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

      function floodFill(startX, startY, fillHex) {
        startX = Math.floor(startX);
        startY = Math.floor(startY);
        const w = canvas.width;
        const h = canvas.height;
        if (startX < 0 || startX >= w || startY < 0 || startY >= h) return;

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const fill = hexToRgb(fillHex);

        const targetIdx = (startY * w + startX) * 4;
        const targetR = data[targetIdx];
        const targetG = data[targetIdx + 1];
        const targetB = data[targetIdx + 2];
        const targetA = data[targetIdx + 3];

        if (Math.abs(targetR - fill.r) < 10 && Math.abs(targetG - fill.g) < 10 && Math.abs(targetB - fill.b) < 10) {
          return;
        }

        const queue = [startX, startY];
        const visited = new Uint8Array(w * h);
        const tolerance = 40;

        function match(idx) {
          return Math.abs(data[idx] - targetR) <= tolerance &&
                 Math.abs(data[idx+1] - targetG) <= tolerance &&
                 Math.abs(data[idx+2] - targetB) <= tolerance;
        }

        while (queue.length > 0) {
          const cy = queue.pop();
          const cx = queue.pop();
          const pIdx = cy * w + cx;

          if (visited[pIdx]) continue;
          visited[pIdx] = 1;

          const idx = pIdx * 4;
          data[idx] = fill.r;
          data[idx + 1] = fill.g;
          data[idx + 2] = fill.b;
          data[idx + 3] = 255;

          // Vecinos (Arriba, Abajo, Izquierda, Derecha)
          if (cy > 0 && !visited[(cy - 1) * w + cx] && match(((cy - 1) * w + cx) * 4)) queue.push(cx, cy - 1);
          if (cy < h - 1 && !visited[(cy + 1) * w + cx] && match(((cy + 1) * w + cx) * 4)) queue.push(cx, cy + 1);
          if (cx > 0 && !visited[cy * w + (cx - 1)] && match((cy * w + (cx - 1)) * 4)) queue.push(cx - 1, cy);
          if (cx < w - 1 && !visited[cy * w + (cx + 1)] && match((cy * w + (cx + 1)) * 4)) queue.push(cx + 1, cy);
        }

        ctx.putImageData(imgData, 0, 0);
        saveHistory();
        emitCanvas();
      }

      // --- GESTIÓN DE EVENTOS DE TRAZADO (POINTERDOWN, POINTERMOVE, POINTERUP) ---
      let currentRoomStatus = 'waiting';

      canvas.onpointerdown = (e) => {
        if (currentRoomStatus !== 'playing') return;
        canvas.setPointerCapture(e.pointerId);

        const pos = getPos(e);
        startPoint = pos;
        lastPoint = pos;
        isDrawing = true;

        if (currentTool === 'bucket') {
          sound.pop();
          floodFill(pos.x, pos.y, currentColor);
          isDrawing = false;
          return;
        }

        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

        const lw = getEffectiveLineWidth();
        ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : currentColor;
        ctx.lineWidth = lw;

        if (currentTool === 'brush' || currentTool === 'eraser') {
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, lw / 2, 0, Math.PI * 2);
          ctx.fillStyle = currentTool === 'eraser' ? '#FFFFFF' : currentColor;
          ctx.fill();
        }
      };

      canvas.onpointermove = (e) => {
        if (!isDrawing || currentRoomStatus !== 'playing') return;
        const cur = getPos(e);
        const lw = getEffectiveLineWidth();
        ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : currentColor;
        ctx.lineWidth = lw;

        if (currentTool === 'brush' || currentTool === 'eraser') {
          ctx.beginPath();
          ctx.moveTo(lastPoint.x, lastPoint.y);
          const midX = (lastPoint.x + cur.x) / 2;
          const midY = (lastPoint.y + cur.y) / 2;
          ctx.quadraticCurveTo(lastPoint.x, lastPoint.y, midX, midY);
          ctx.stroke();
          lastPoint = cur;
          scheduleEmit();
        } else if (snapshot) {
          // Previsualización interactiva de Línea, Rectángulo o Círculo
          ctx.putImageData(snapshot, 0, 0);

          if (currentTool === 'line') {
            ctx.beginPath();
            ctx.moveTo(startPoint.x, startPoint.y);
            ctx.lineTo(cur.x, cur.y);
            ctx.stroke();
          } else if (currentTool === 'rect') {
            const rx = Math.min(startPoint.x, cur.x);
            const ry = Math.min(startPoint.y, cur.y);
            const rw = Math.abs(cur.x - startPoint.x);
            const rh = Math.abs(cur.y - startPoint.y);
            ctx.strokeRect(rx, ry, rw, rh);
          } else if (currentTool === 'circle') {
            const rx = Math.abs(cur.x - startPoint.x);
            const ry = Math.abs(cur.y - startPoint.y);
            const r = Math.sqrt(rx * rx + ry * ry);
            ctx.beginPath();
            ctx.arc(startPoint.x, startPoint.y, r, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      };

      canvas.onpointerup = () => {
        if (!isDrawing) return;
        isDrawing = false;
        startPoint = null;
        lastPoint = null;
        snapshot = null;
        saveHistory();
        emitCanvas();
      };

      let emitTimer = null;
      function scheduleEmit() {
        if (emitTimer) return;
        emitTimer = setTimeout(() => {
          emitTimer = null;
          emitCanvas();
        }, 260);
      }

      function emitCanvas() {
        if (!playerNum) return;
        const thumb = document.createElement('canvas');
        const scale = Math.min(340 / canvas.width, 340 / canvas.height, 1);
        thumb.width = canvas.width * scale;
        thumb.height = canvas.height * scale;
        const tctx = thumb.getContext('2d');
        tctx.fillStyle = '#FFFFFF';
        tctx.fillRect(0, 0, thumb.width, thumb.height);
        tctx.drawImage(canvas, 0, 0, thumb.width, thumb.height);

        const b64 = thumb.toDataURL('image/jpeg', 0.78);
        const imgKey = playerNum === 1 ? 'player1_image' : 'player2_image';
        update(ref(db, `rooms/${roomId}`), { [imgKey]: b64 });
      }

      onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.val();
        currentRoomStatus = data.status;

        document.getElementById('player-prompt-val').textContent = data.prompt || '¡A dibujar!';
        document.getElementById('player-timer-val').textContent = data.timer;

        const waitOverlay = document.getElementById('player-waiting-overlay');
        const resOverlay = document.getElementById('player-result-overlay');

        if (data.status === 'playing') {
          waitOverlay.classList.add('hidden');
          resOverlay.classList.add('hidden');
        } else if (data.status === 'waiting' && playerNum) {
          waitOverlay.classList.remove('hidden');
          resOverlay.classList.add('hidden');
        } else if (data.status === 'finished' && data.verdict) {
          resOverlay.classList.remove('hidden');
          const isWinner = data.verdict.winner === `Jugador ${playerNum}`;
          document.getElementById('player-verdict-title').textContent = isWinner ? '¡HAS GANADO!' : data.verdict.winner === 'Empate' ? '¡EMPATE!' : 'GANÓ TU RIVAL';
          document.getElementById('player-verdict-desc').textContent = data.verdict.verdict;
        }
      });
    }
  </script>
</body>
</html>
